<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF671F" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#046A38" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A" />
      <stop offset="100%" stop-color="#102A43" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <path d="M50 8 L84 22 V50 C84 72 69 88 50 94 C31 88 16 72 16 50 V22 Z" fill="url(#shieldGrad)" stroke="#FF671F" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Decorative Accent Ring -->
  <circle cx="50" cy="46" r="26" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" fill="none" />
  <!-- Ashoka / Lotus / Hands motif: Stylized radiating rays of service -->
  <circle cx="50" cy="46" r="7" fill="#FF671F" />
  <circle cx="50" cy="46" r="4" fill="#FFFFFF" />
  <!-- Radiating pillars of JanSeva (4 primary directions) -->
  <path d="M50 25 V33" stroke="#FF671F" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 59 V67" stroke="#046A38" stroke-width="3" stroke-linecap="round"/>
  <path d="M29 46 H37" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M63 46 H71" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Diagonal petals / rays -->
  <path d="M35 31 L41 37" stroke="#FF671F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M65 31 L59 37" stroke="#FF671F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M35 61 L41 55" stroke="#046A38" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M65 61 L59 55" stroke="#046A38" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom Foundation ribbon representing Public Trust -->
  <path d="M30 76 C42 83 58 83 70 76" stroke="#046A38" stroke-width="3" stroke-linecap="round"/>
  <path d="M36 81 C45 86 55 86 64 81" stroke="#FF671F" stroke-width="2" stroke-linecap="round"/>
</svg>
